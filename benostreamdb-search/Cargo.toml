[package]
name = "benostreamdb-search"
version = "0.7.0"
edition = "2021"
license = "MIT AND Apache-2.0"
description = "BenoStreamDB Search - OpenSearch/ES 7.10-compatible REST API over BenoStreamDB"
repository = "https://github.com/benolabsai/benostreamdb"
homepage = "https://github.com/benolabsai/benostreamdb"
keywords = ["database", "search", "opensearch", "elasticsearch", "vector-search"]
categories = ["database-implementations"]

[[bin]]
name = "bsdb-search"
path = "src/main.rs"

[lib]
name = "benostreamdb_search"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
benostreamdb = { path = ".." }
arrow = { version = "57.2.0", features = ["ffi"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
chrono = "0.4"
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp", "http"] }
rayon = "1.12.0"
dhat = "0.3"

[features]
default = []
# Opt-in heap profiling for the server binary. Off by default: `dhat::Alloc`
# as the global allocator conflicts with the jemalloc global allocator the
# `benostreamdb` library installs on Linux, which made the bin unbuildable.
dhat-heap = []
# Production-path no-panic restriction lints (see NO_PANIC_POLICY.md).
no-panic = []
cuda = ["benostreamdb/cuda"]
wgpu = ["benostreamdb/wgpu", "benostreamdb/pollster"]
rocm = ["wgpu"]
intel = ["wgpu"]
all-gpu = ["cuda", "wgpu"]

[dev-dependencies]
tempfile = "3.10"
