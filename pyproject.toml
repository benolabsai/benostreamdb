[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "benostreamdb"
# Single source of truth is Cargo.toml [workspace.package].version; maturin
# derives the Python version from it (PEP 621 dynamic version). The release
# workflow overrides this to <base>.postN at build time for a PyPI repack.
dynamic = ["version"]
description = "BenoStreamDB - Serverless Index-Streaming Database with Overlay Indexing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND Apache-2.0" }
authors = [
    { name = "Beno Labs" }
]
keywords = ["database", "vector", "search", "indexing", "parquet", "iceberg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyarrow>=14.0.0",
    "numpy>=1.20.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # Backstop for tests that block on a native call or a socket. Without it a
    # hang silently consumes the whole CI job budget: the `unit` shard sat at 7%
    # for 19.5 minutes and was killed, with no test named in the log.
    "pytest-timeout>=2.3",
    "maturin>=1.7",
    "boto3>=1.26.0",
    "pyiceberg[sql-sqlite]>=0.6.0",
    "networkx",
    "cffi",
    "scikit-learn",
    "pandas",
    "hypothesis",
    "jinja2",
]
# Hardware acceleration extras
all_gpu = []
src = ["maturin>=1.7"]

# A hang must fail fast and name the test, instead of being reported as a
# cancelled job with no stack. `thread` method works even when the block is
# inside a native extension call; 180s is far above any legitimate test runtime
# here (the whole shard should be a few minutes) and well below the job timeout.
[tool.pytest.ini_options]
timeout = 180
timeout_method = "thread"

[project.urls]
Homepage = "https://github.com/benolabsai/benostreamdb"
Repository = "https://github.com/benolabsai/benostreamdb"

[project.scripts]
bsdb = "benostreamdb.cli:main"


[tool.maturin]
features = ["python"]
# Build both the Rust library and Python bindings (multi-version compatible)
module-name = "benostreamdb.benostreamdb"
python-source = "python"
# Build both the Rust library and Python bindings
bindings = "pyo3"
sdist-include = ["LICENSE*", "README.md", "THIRDPARTY_NOTICES.md", "vendor/**/*", "tests/**/*", "benches/**/*"]
# Optimizations for WHEEL builds
strip = true
# Use sccache if available during build
sccache = false
