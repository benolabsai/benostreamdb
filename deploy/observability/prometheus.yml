global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics pushed by the engine via OTLP, re-exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Direct pull from the Flight SQL server / embedded exporter on the host.
  # Set BSDB_METRICS_BIND=0.0.0.0 so the container can reach it.
  - job_name: benostreamdb
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: benostreamdb
