version: "3.8"

services:
  # ---------------------
  # 1. RustFS (S3)
  # ---------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    environment:
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD}
      # Performance settings from template
      - RUSTFS_CACHE_DRIVES=/tmp/cache
      - RUSTFS_CACHE_QUOTA=80
      - RUSTFS_CACHE_AFTER=3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/data/rustfs:/data
    command: server /data --console-address ":9001"
    networks:
      - benostream_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/rustfs/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS Setup (Buckets)
  rustfs-init:
    image: rustfs/mc:latest
    container_name: rustfs-init
    networks:
      - benostream_net
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 ${RUSTFS_ROOT_USER} ${RUSTFS_ROOT_PASSWORD};
      mc mb rustfs/warehouse --ignore-existing;
      mc mb rustfs/benostream --ignore-existing;
      mc policy set public rustfs/warehouse;
      mc policy set public rustfs/benostream;
      exit 0;
      "

  # ---------------------
  # 2. Nessie (Catalog) with Postgres
  # ---------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.105.5
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120
      - QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL=jdbc:postgresql://nessie-postgres:5432/nessie
      - QUARKUS_DATASOURCE_POSTGRESQL_USERNAME=nessie
      - QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD=${NESSIE_POSTGRES_PASSWORD}
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE=postgresql
      # Iceberg REST
      - nessie.catalog.iceberg-rest.enabled=true
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.s3.endpoint=http://rustfs:9000/
      - nessie.catalog.s3.access-key=${S3_ACCESS_KEY}
      - nessie.catalog.s3.secret-key=${S3_SECRET_KEY}
      - nessie.catalog.s3.path-style-access=true
      - nessie.server.authentication.enabled=false
    networks:
      - benostream_net
    depends_on:
      rustfs:
        condition: service_healthy
      nessie-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5

  nessie-postgres:
    image: postgres:15
    container_name: nessie-postgres
    environment:
      - POSTGRES_DB=nessie
      - POSTGRES_USER=nessie
      - POSTGRES_PASSWORD=${NESSIE_POSTGRES_PASSWORD}
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    networks:
      - benostream_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------
  # 3. Trino
  # ---------------------
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      # Use the connector's checked-in Trino configuration
      - ./trino-benostreamdb/etc:/etc/trino
      # Mount our built plugin
      # - ./trino-benostreamdb/target/trino-benostream-0.1.0-SNAPSHOT:/usr/lib/trino/plugin/benostream
    environment:
      - TRINO_ENV=dev
    networks:
      - benostream_net
    depends_on:
      rustfs:
        condition: service_healthy
      nessie:
        condition: service_healthy

  # ---------------------
  # 4. Azurite (Azure Blob)
  # ---------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    networks:
      - benostream_net

  # ---------------------
  # 5. Fake GCS
  # ---------------------
  fake-gcs:
    image: fsouza/fake-gcs-server
    container_name: fake-gcs
    ports:
      - "4443:4443"
    command: -scheme http
    networks:
      - benostream_net

networks:
  benostream_net:
    driver: bridge
