# ---------------------------------------------------------------------------
# BenoStreamDB Quickstart — Full Stack
# Single command to launch RustFS + Nessie + BenoStreamDB (all APIs)
#
# Usage:
#   docker compose -f docker-compose.quickstart.yml up
#
# Endpoints:
#   http://localhost:9200   — Elasticsearch 7.10 REST API
#   http://localhost:6333   — Qdrant REST API
#   grpc://localhost:50051  — Arrow Flight SQL (ADBC/JDBC/ODBC)
#   http://localhost:9000   — RustFS Console (rustfsadmin/rustfsadmin)
#   http://localhost:19120  — Nessie REST Catalog
# ---------------------------------------------------------------------------

services:
  # ---------------------
  # 1. RustFS (S3)
  # ---------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: bsdb-rustfs
    environment:
      - RUSTFS_ROOT_USER=rustfsadmin
      - RUSTFS_ROOT_PASSWORD=rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    command: server /data --console-address ":9001"
    networks:
      - benostream_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/rustfs/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS bucket initialization
  rustfs-init:
    image: rustfs/mc:latest
    container_name: bsdb-rustfs-init
    networks:
      - benostream_net
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin;
      mc mb rustfs/warehouse --ignore-existing;
      mc mb rustfs/benostream --ignore-existing;
      mc policy set public rustfs/warehouse;
      mc policy set public rustfs/benostream;
      exit 0;
      "

  # ---------------------
  # 2. Nessie Catalog
  # ---------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.105.5
    container_name: bsdb-nessie
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120
      - NESSIE_VERSION_STORE_TYPE=IN_MEMORY
      # Iceberg REST catalog
      - nessie.catalog.iceberg-rest.enabled=true
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.s3.endpoint=http://rustfs:9000/
      - nessie.catalog.s3.access-key=rustfsadmin
      - nessie.catalog.s3.secret-key=rustfsadmin
      - nessie.catalog.s3.path-style-access=true
      - nessie.server.authentication.enabled=false
    networks:
      - benostream_net
    depends_on:
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------
  # 3. BenoStreamDB (All APIs)
  # ---------------------
  benostreamdb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: benostreamdb/quickstart:latest
    container_name: bsdb-server
    restart: unless-stopped
    ports:
      - "9200:9200"    # Elasticsearch 7.10 REST
      - "6333:6333"    # Qdrant REST
      - "50051:50051"  # Arrow Flight SQL gRPC
    environment:
      - BENOSEARCH_BIND=0.0.0.0
      - BENOSEARCH_PORT=9200
      - QDRANT_BIND=0.0.0.0
      - QDRANT_PORT=6333
      - BENOSEARCH_STORAGE_URI=s3://benostream/
      - BENOSEARCH_AUTO_REFRESH_SECS=5
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_ENDPOINT=http://rustfs:9000
      - AWS_REGION=us-east-1
      - AWS_ALLOW_HTTP=true
      - RUST_LOG=info
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    volumes:
      - bsdb-cache:/home/benostream/.benostreamdb
    networks:
      - benostream_net
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs-data:
    driver: local
  bsdb-cache:
    driver: local

networks:
  benostream_net:
    driver: bridge
