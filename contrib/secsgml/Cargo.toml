[package]
name = "secsgml"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "John Friedman",
    "Richard Albright and BenoStreamDB Contributors",
]
description = "Fast, safe native Rust port of secsgml / secsgml2 for SEC EDGAR SGML filings"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
