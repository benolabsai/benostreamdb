[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "benostreamdb-search"
version = "0.7.0"
description = "BenoStreamDB Search - OpenSearch and Qdrant REST compatibility gateway for BenoStreamDB"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT AND Apache-2.0" }
authors = [
    { name = "Richard Albright and BenoStreamDB Contributors" }
]
keywords = ["database", "search", "opensearch", "qdrant", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "benostreamdb>=0.11.1",
]

[project.scripts]
bsdb-search = "benostreamdb_search:main"

[tool.maturin]
bindings = "bin"
python-source = "python"
strip = true
