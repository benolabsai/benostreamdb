[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "benostreamdb-mcp"
# Inherits the engine version from Cargo.toml [workspace.package].version.
dynamic = ["version"]
description = "BenoStreamDB Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND Apache-2.0" }
authors = [
    { name = "Richard Albright and BenoStreamDB Contributors" }
]
keywords = ["database", "mcp", "llm", "claude", "ai", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
]
dependencies = [
    "benostreamdb>=0.14.1",
]

[tool.maturin]
bindings = "bin"
strip = true
