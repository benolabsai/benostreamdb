[package]
name = "benostreamdb-mcp"
version.workspace = true
edition = "2021"
publish = false
description = "Model Context Protocol (MCP) server for BenoStreamDB"

[lib]
name = "benostreamdb_mcp"
path = "src/lib.rs"

[[bin]]
name = "benostreamdb-mcp"
path = "src/main.rs"

[dependencies]
benostreamdb = { path = "../../" }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arrow = "57.2.0"
arrow-json = "57.2.0"
tempfile = "3.10"
sqlparser = { version = "0.55.0", features = ["visitor"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Local embeddings use Candle (pure Rust) instead of ONNX Runtime. This keeps
# the wheel small enough for PyPI and avoids a native inference library.
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
pdf-extract = "0.7"
calamine = "0.26"
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
zstd = "0.13"
csv = "1.3"

