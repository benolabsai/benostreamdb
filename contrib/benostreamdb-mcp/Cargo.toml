[package]
name = "benostreamdb-mcp"
version.workspace = true
edition = "2021"
publish = false
description = "Model Context Protocol (MCP) server for BenoStreamDB"

[dependencies]
benostreamdb = { path = "../../" }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arrow = "57.2.0"
arrow-json = "57.2.0"
tempfile = "3.10"
