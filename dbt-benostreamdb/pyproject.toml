[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-benostreamdb"
# dbt adapters version as `<dbt-core-major>.<minor>.<patch>` (see __version__.py),
# independent of the BenoStreamDB engine version.
dynamic = ["version"]
description = "The BenoStreamDB adapter plugin for dbt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Richard Albright", email = "rla3rd@gmail.com" }]
keywords = ["dbt", "benostreamdb", "iceberg", "vector-search", "analytics"]
dependencies = [
    # dbt >= 1.8 decoupled adapters from dbt-core: declare compatibility with
    # the `dbt-adapters` interface (major range) instead of pinning a dbt-core
    # minor. The adapter's OWN version is independent (it carries the
    # BenoStreamDB engine version); the supported dbt-core range is declared in
    # dbt/include/benostreamdb/dbt_project.yml via require-dbt-version.
    "dbt-adapters>=1.0,<2.0",
    "dbt-core>=1.8,<2.0",
    "benostreamdb>=0.14.0",
    "pyarrow>=15.0.0",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/benolabsai/benostreamdb"
Repository = "https://github.com/benolabsai/benostreamdb"
Documentation = "https://github.com/benolabsai/benostreamdb/blob/main/dbt-benostreamdb/README.md"

[tool.setuptools.dynamic]
version = { attr = "dbt.adapters.benostreamdb.__version__.version" }

[tool.setuptools.packages.find]
include = ["dbt", "dbt.*"]

# Ship the dbt macros / project files that live under dbt/include/.
[tool.setuptools.package-data]
"dbt.include.benostreamdb" = ["**/*.sql", "**/*.yml"]
