[package]
name = "hyperstreamdb-search"
version = "0.5.5"
edition = "2021"
license = "MIT AND Apache-2.0"
description = "HyperStreamDB Search - OpenSearch/ES 7.10-compatible REST API over HyperStreamDB"
repository = "https://github.com/rla3rd/hyperstreamdb"
homepage = "https://github.com/rla3rd/hyperstreamdb"
keywords = ["database", "search", "opensearch", "elasticsearch", "vector-search"]
categories = ["database-implementations"]

[[bin]]
name = "hypersearch"
path = "src/main.rs"

[lib]
name = "hyperstreamdb_search"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
hyperstreamdb = { path = ".." }
arrow = { version = "57.2.0", features = ["ffi"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
chrono = "0.4"
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp", "http"] }

[dev-dependencies]
tempfile = "3.10"
