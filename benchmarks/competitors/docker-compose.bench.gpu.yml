# GPU override: adds NVIDIA device access to the runner and a GPU runner image.
#
# Merge with the base file:
#   docker compose -f benchmarks/competitors/docker-compose.bench.yml \
#     -f benchmarks/competitors/docker-compose.bench.gpu.yml \
#     --profile run run --rm bench-gpu
#
# docker_bench.sh --gpu (or --both) does this automatically and tags results
# with device=gpu. Only GPU-capable engines run here (faiss, benostreamdb,
# cugraph).
services:
  bench:
    # `gpus: all` (Compose v2.30+) is equivalent to `docker run --gpus all`.
    # The older `deploy.resources.reservations.devices` form left cuGraph/cuDF
    # unable to initialise a CUDA context on Blackwell (sm_120), surfacing as a
    # misleading "cudaErrorMemoryAllocation: out of memory".
    gpus: all

  bench-gpu:
    extends:
      file: docker-compose.bench.yml
      service: bench
    image: bsdb-bench-runner-gpu:latest
    build:
      context: ../..
      dockerfile: benchmarks/competitors/Dockerfile.bench.gpu
    gpus: all
