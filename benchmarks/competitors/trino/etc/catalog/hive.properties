connector.name=hive
# File-based metastore: no Hive Metastore service needed. The runner registers
# the shared Parquet as an external table, so Trino reads it directly instead of
# bulk-loading rows through the memory connector (which OOMs on large datasets).
hive.metastore=file
hive.metastore.catalog.dir=file:///opt/bench/data/hive_catalog
