connector.name=benostreamdb
# The connector reads `benostream.warehouse` (NOT `benostream.base-uri` — the
# sample config in the connector README is wrong). Schemas are subdirectories
# of the warehouse, so a table `benostreamdb.default.events` lives at
# `<warehouse>/default/events`.
#
# The path must match the runner's mount (`/opt/bench/data`) because Iceberg
# metadata stores absolute `file:///opt/bench/data/...` locations.
benostream.warehouse=file:///opt/bench/data/bsdb_warehouse
