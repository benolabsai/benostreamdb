# Competitor + BenoStreamDB benchmark stack with a single, shared hardware
# profile so every participant is measured under an identical envelope.
#
#   BENCH_CPUS=8 BENCH_MEM=16g \
#     docker compose -f benchmarks/competitors/docker-compose.bench.yml up -d
#
#   # Run one competitor on the runner image (same envelope as the engines):
#   ENGINE=pgvector DATASET=sift-128-euclidean LIMIT=20000 QUERIES=500 \
#     docker compose -f benchmarks/competitors/docker-compose.bench.yml \
#     --profile run run --rm bench
#
#   # Run BenoStreamDB through the same runner image (installs the abi3 wheel):
#   ENGINE=benostreamdb DATASET=sift-128-euclidean LIMIT=20000 QUERIES=500 \
#     docker compose -f benchmarks/competitors/docker-compose.bench.yml \
#     --profile run run --rm bench
#
# The envelope (BENCH_CPUS / BENCH_MEM) is applied to BOTH the server engines
# and the runner, so no participant gets more cores or RAM than another.
# docker_bench.sh drives the full matrix.

x-envelope: &envelope
  deploy:
    resources:
      limits:
        cpus: "${BENCH_CPUS:-8}"
        memory: "${BENCH_MEM:-16g}"
      reservations:
        cpus: "${BENCH_CPUS:-8}"
        memory: "${BENCH_MEM:-16g}"

x-bench-env: &bench-env
  BENCH_CPUS: "${BENCH_CPUS:-8}"
  BENCH_MEM: "${BENCH_MEM:-16g}"
  DATASET: "${DATASET:-sift-128-euclidean}"
  LIMIT: "${LIMIT:-20000}"
  QUERIES: "${QUERIES:-500}"
  K: "${K:-10}"
  M: "${M:-16}"
  EF_CONSTRUCTION: "${EF_CONSTRUCTION:-200}"
  EF_SEARCH: "${EF_SEARCH:-200}"
  ENGINE: "${ENGINE:-faiss}"
  DEVICE: "${DEVICE:-cpu}"
  WORKLOAD: "${WORKLOAD:-vector}"
  ALGORITHM: "${ALGORITHM:-pagerank}"
  # BEIR lexical/hybrid workload (WORKLOAD=beir). One process runs every engine
  # under this container's envelope; the dataset is mounted read-only.
  BEIR_DATASET: "${BEIR_DATASET:-scifact}"
  BEIR_ENGINES: "${BEIR_ENGINES:-benostreamdb,tantivy,opensearch}"
  BEIR_MODE: "${BEIR_MODE:-lexical}"
  GRAPH_EDGES: "${GRAPH_EDGES:-}"
  GRAPH_DATASET: "${GRAPH_DATASET:-graph}"
  SQL: "${SQL:-}"
  PARQUET: "${PARQUET:-}"
  SQL_DATASET: "${SQL_DATASET:-sql}"
  PGVECTOR_DSN: "postgresql://bench:bench@pgvector:5432/bench"
  ES_URL: "http://opensearch:9200"
  QDRANT_URL: "http://qdrant:6333"
  MILVUS_URI: "http://milvus:19530"
  WEAVIATE_URL: "http://weaviate:8080"
  MEMGRAPH_URI: "bolt://memgraph:7687"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "benchpass"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: ""
  TRINO_HOST: "trino"
  TRINO_PORT: "8080"
  TRINO_USER: "bench"
  TRINO_CATALOG: "memory"
  TRINO_SCHEMA: "default"
  # Cap the RAPIDS (cuDF/cuGraph) device pool so it leaves headroom for the
  # desktop compositor (Wayland holds ~1.3 GB on the 5070 Ti); without this the
  # pool grows into the whole card and cuGraph fails with a misleading
  # "cudaErrorMemoryAllocation: out of memory".
  RMM_POOL_SIZE: "12GB"

networks:
  bench: {}

services:
  # --- Server engines (each limited by the shared envelope) ----------------- #
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    # Give Postgres a realistic server config for an ANN build/query workload.
    # The stock defaults (shared_buffers=128MB, maintenance_work_mem=64MB)
    # throttle HNSW construction; the envelope still caps total memory.
    command: ["postgres", "-c", "shared_buffers=4GB", "-c", "maintenance_work_mem=2GB", "-c", "max_parallel_maintenance_workers=4"]
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 3s
      timeout: 3s
      retries: 30
    <<: *envelope

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Bench-passw0rd!"
      OPENSEARCH_JAVA_OPTS: "-Xms4g -Xmx4g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  qdrant:
    image: qdrant/qdrant:latest
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    # Embedded etcd + local storage so the standalone node needs no sidecars.
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: "local"
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  weaviate:
    image: semitechnologies/weaviate:1.28.4
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: "none"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
      QUERY_DEFAULTS_LIMIT: "1000"
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  memgraph:
    # The `-mage` image ships the MAGE query modules (pagerank, wcc, ...).
    image: memgraph/memgraph-mage:latest
    command: ["--telemetry-enabled=false", "--also-log-to-stderr=true"]
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/benchpass"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_max__size: "6G"
      # Default page cache is 512MB; raise it so GDS projection/load is not
      # disk-bound (the envelope still caps total memory).
      NEO4J_server_memory_pagecache_size: "4G"
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # No data volume: the runner loads the shared Parquet into a `MergeTree`
    # table via the client, so ClickHouse never touches the host data dir (its
    # entrypoint chowns any mounted dir, which would break the host).
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  # Trino (distributed SQL). Uses the Hive connector with a file-based
  # metastore over the shared Parquet directory, so the runner can register the
  # benchmark table `t` as an external table and run the shared SQL unchanged.
  trino:
    build:
      context: ../..
      dockerfile: benchmarks/competitors/Dockerfile.trino
    image: bsdb-trino:latest
    # The runner writes the shared data dir as root, so the connector's write
    # path (CTAS/INSERT/MERGE) needs root here too; otherwise the `trino` user
    # gets EACCES on the root-owned warehouse. Read-only queries are unaffected.
    user: "0:0"
    environment:
      TRINO_HOST: "trino"
      TRINO_PORT: "8080"
    volumes:
      - ./trino/etc:/etc/trino
      # Mount at the SAME path the runner uses (`/opt/bench/data`): the Iceberg
      # metadata/manifest store absolute `file:///opt/bench/data/...` locations,
      # so a different mount point makes the connector resolve to missing files
      # and silently return 0 rows.
      - ./data:/opt/bench/data
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    <<: *envelope

  # --- Runner (competitors AND BenoStreamDB) under the SAME envelope -------- #
  bench:
    build:
      context: ../..
      dockerfile: benchmarks/competitors/Dockerfile.bench
    image: bsdb-bench-runner:latest
    profiles: ["run"]
    networks: [bench]
    environment: *bench-env
    volumes:
      - ./results:/results
      - ./data:/opt/bench/data
      # BEIR corpus/queries/qrels (read-only) and the report output dir. The
      # reports land in benchmarks/beir/results/ so generate_summary.py picks
      # them up alongside the host-run artifacts.
      - ../beir/data:/opt/bench/beir_data:ro
      - ../beir/results:/results/beir
      - ../../dist:/wheels:ro
    # The runner logic lives in the image's CMD (`/opt/bench/run_bench.sh`);
    # an inline compose `command:` was mangled by YAML folding.
    <<: *envelope
