[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "benostreamdb-flight"
version = "0.12.0"
description = "BenoStreamDB Flight SQL - Arrow Flight SQL gateway over BenoStreamDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND Apache-2.0" }
authors = [
    { name = "Richard Albright and BenoStreamDB Contributors" }
]
keywords = ["database", "arrow", "flight-sql", "vector-search", "iceberg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "benostreamdb>=0.12.0",
]

[tool.maturin]
bindings = "bin"
strip = true
