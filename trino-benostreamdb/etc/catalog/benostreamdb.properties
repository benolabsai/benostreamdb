connector.name=benostreamdb
# The connector factory reads `benostream.warehouse` (the older
# `benostream.base-uri` key is ignored). Schemas are subdirectories of the
# warehouse, so `benostreamdb.default.events` resolves to
# `<warehouse>/default/events`.
benostream.warehouse=s3://benostream/
benostream.s3.endpoint=http://rustfs:9000
benostream.s3.access-key=${TRINO_S3_ACCESS_KEY}
benostream.s3.secret-key=${TRINO_S3_SECRET_KEY}
