# Cargo Audit Configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
ignore = [
    "RUSTSEC-2026-0258", # h2: unbounded empty DATA frames (transitive dep in HTTP/gRPC stacks)
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation in NsReader
    "RUSTSEC-2025-0134", # rustls-pemfile: unmaintained advisory
    "RUSTSEC-2026-0190", # anyhow: Error::downcast_mut unsoundness advisory
    "RUSTSEC-2026-0221", # event-listener: !Send tags across thread boundaries
    "RUSTSEC-2026-0204", # crossbeam-epoch: pointer dereference
]
yanked = "warn"
