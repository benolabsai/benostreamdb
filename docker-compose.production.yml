# ---------------------------------------------------------------------------
# BenoStreamDB Production Deployment
# Separate containers for each service (microservice architecture)
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Requires .env file with credentials (see .env.example)
# ---------------------------------------------------------------------------

services:
  # ---------------------
  # Search Service (ES 7.10 + Qdrant APIs)
  # ---------------------
  search:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    image: benostreamdb/search:${BSDB_VERSION:-latest}
    container_name: bsdb-search
    restart: unless-stopped
    ports:
      - "${BSDB_SEARCH_PORT:-9200}:9200"
      - "${BSDB_QDRANT_PORT:-6333}:6333"
    environment:
      - BSDB_SEARCH_BIND=0.0.0.0
      - BSDB_SEARCH_PORT=9200
      - BSDB_QDRANT_BIND=0.0.0.0
      - BSDB_QDRANT_PORT=6333
      - BSDB_AUTH_REQUIRED=1
      - BSDB_API_KEY=${BSDB_API_KEY:-}
      - BSDB_SEARCH_STORAGE_URI=${BSDB_SEARCH_STORAGE_URI:-s3://benostream/}
      - BSDB_SEARCH_AUTO_REFRESH_SECS=${BSDB_SEARCH_AUTO_REFRESH_SECS:-5}
      # Resource limits are derived from the container's cgroup memory limit
      # (see RESOURCE_LIMITS.md). Leave these empty to use the derived defaults;
      # set them only to pin a value explicitly.
      - BSDB_MAX_INGEST_RAM_GB=${BSDB_MAX_INGEST_RAM_GB:-}
      - BSDB_INGEST_MEMORY_BUDGET_GB=${BSDB_INGEST_MEMORY_BUDGET_GB:-}
      - BSDB_INDEX_BUILD_CONCURRENCY=${BSDB_INDEX_BUILD_CONCURRENCY:-}
      - BSDB_MIN_FREE_DISK_GB=${BSDB_MIN_FREE_DISK_GB:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_ALLOW_HTTP=${AWS_ALLOW_HTTP:-false}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Serverless sizing: the engine derives every limit from this container's
    # cgroup memory limit (see RESOURCE_LIMITS.md) — the ingest high-water mark
    # and heap-trim budget are 0.8 x the limit, and segment index-build
    # concurrency is clamp(limit / 8 GiB, 1, nproc). The default is deliberately
    # small so the same image is safe scaled to zero in a tiny container; raise
    # the container limit per deployment to scale up, with no engine config
    # change. (CPUs cap build parallelism, so a larger ingest box wants more of
    # them too.)
    deploy:
      resources:
        limits:
          memory: ${SEARCH_MEMORY:-4G}
          cpus: "${SEARCH_CPUS:-2.0}"
    volumes:
      - search-cache:/home/benostream/.benostreamdb
    networks:
      - benostream_net

  # ---------------------
  # Flight SQL Service (Arrow Flight gRPC)
  # ---------------------
  flight:
    build:
      context: .
      dockerfile: docker/Dockerfile.flight
    image: benostreamdb/flight:${BSDB_VERSION:-latest}
    container_name: bsdb-flight
    restart: unless-stopped
    ports:
      - "${FLIGHT_PORT:-50051}:50051"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BSDB_AUTH_REQUIRED=1
      - BSDB_API_KEY=${BSDB_API_KEY:-}
      - BSDB_FLIGHT_BIND=0.0.0.0
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_ALLOW_HTTP=${AWS_ALLOW_HTTP:-false}
      - RUST_LOG=${RUST_LOG:-info}
      # Derived from the container's cgroup memory limit; set to pin explicitly.
      - BSDB_MAX_INGEST_RAM_GB=${BSDB_MAX_INGEST_RAM_GB:-}
      - BSDB_INGEST_MEMORY_BUDGET_GB=${BSDB_INGEST_MEMORY_BUDGET_GB:-}
      - BSDB_INDEX_BUILD_CONCURRENCY=${BSDB_INDEX_BUILD_CONCURRENCY:-}
      - BSDB_MIN_FREE_DISK_GB=${BSDB_MIN_FREE_DISK_GB:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Same serverless derivation as `search` above.
    deploy:
      resources:
        limits:
          memory: ${FLIGHT_MEMORY:-4G}
          cpus: "${FLIGHT_CPUS:-2.0}"
    volumes:
      - flight-cache:/home/benostream/.benostreamdb
    networks:
      - benostream_net

volumes:
  search-cache:
    driver: local
  flight-cache:
    driver: local

networks:
  benostream_net:
    driver: bridge
