# ---------------------------------------------------------------------------
# HyperStreamDB Production Deployment
# Separate containers for each service (microservice architecture)
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Requires .env file with credentials (see .env.example)
# ---------------------------------------------------------------------------

services:
  # ---------------------
  # Search Service (ES 7.10 + Qdrant APIs)
  # ---------------------
  search:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    image: hyperstreamdb/search:${HDB_VERSION:-latest}
    container_name: hdb-search
    restart: unless-stopped
    ports:
      - "${HYPERSEARCH_PORT:-9200}:9200"
      - "${QDRANT_PORT:-6333}:6333"
    environment:
      - HYPERSEARCH_BIND=0.0.0.0
      - HYPERSEARCH_PORT=9200
      - QDRANT_BIND=0.0.0.0
      - QDRANT_PORT=6333
      - HYPERSEARCH_STORAGE_URI=${HYPERSEARCH_STORAGE_URI:-s3://hyperstream/}
      - HYPERSEARCH_AUTO_REFRESH_SECS=${HYPERSEARCH_AUTO_REFRESH_SECS:-5}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_ALLOW_HTTP=${AWS_ALLOW_HTTP:-false}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${SEARCH_MEMORY:-4G}
          cpus: "${SEARCH_CPUS:-2.0}"
    volumes:
      - search-cache:/home/hyperstream/.hyperstreamdb
    networks:
      - hyperstream_net

  # ---------------------
  # Flight SQL Service (Arrow Flight gRPC)
  # ---------------------
  flight:
    build:
      context: .
      dockerfile: docker/Dockerfile.flight
    image: hyperstreamdb/flight:${HDB_VERSION:-latest}
    container_name: hdb-flight
    restart: unless-stopped
    ports:
      - "${FLIGHT_PORT:-50051}:50051"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_ALLOW_HTTP=${AWS_ALLOW_HTTP:-false}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:50051/", "||", "exit", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${FLIGHT_MEMORY:-4G}
          cpus: "${FLIGHT_CPUS:-2.0}"
    volumes:
      - flight-cache:/home/hyperstream/.hyperstreamdb
    networks:
      - hyperstream_net

volumes:
  search-cache:
    driver: local
  flight-cache:
    driver: local

networks:
  hyperstream_net:
    driver: bridge
