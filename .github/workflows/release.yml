name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Limit parallel compilation/linking jobs to avoid running out of memory/disk space on the runner
  CARGO_BUILD_JOBS: 2
  # Reduce disk usage by disabling incremental compilation and heavy debug info
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Opt into Node.js 24 for actions to avoid deprecation warnings (required by June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: [ci]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.10"] # ABI3 Universal Wheels
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-${{ matrix.target }}-${{ matrix.python-version }}"
          cache-targets: false
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "12.1.0"
          method: "network"
          # We only need compilation, not the full driver
          sub-packages: '["nvcc", "cudart-dev"]'
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features "python" --zig
          sccache: "false"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  macos:
    needs: [ci]
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.10"] # ABI3 Universal Wheels
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-${{ matrix.target }}-${{ matrix.python-version }}"
          cache-targets: false
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features "python"
          sccache: "false"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    needs: [ci]
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64]
        python-version: ["3.10"] # ABI3 Universal Wheels
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-${{ matrix.target }}-${{ matrix.python-version }}"
          cache-targets: false
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features "python"
          sccache: "false"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist
      - name: Install cargo-wix
        run: cargo install cargo-wix
      - name: Build Windows binaries and MSI
        run: |
          cargo build --release --workspace
          cargo wix --nocapture
      - name: Upload Windows MSI and Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            target/wix/*.msi
            target/release/*.exe

  sdist:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
          fi
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Pre-release gate: the long-running correctness evidence. This is the
  # "millions of operations" bar from the production-readiness plan — it does
  # NOT run on every push (see soak.yml for the weekly canary), only before a
  # tag is published. A divergence fails the release.
  soak-gate:
    name: Pre-release soak gate
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      - name: Randomized differential workload (model oracle)
        env:
          SKIP_GPU_TESTS: "1"
          RUST_LOG: "error"
        run: cargo test --test test_randomized_differential_workload -- --nocapture
      - name: Crash-injection workload sweep
        env:
          SKIP_GPU_TESTS: "1"
          RUST_LOG: "error"
        run: cargo test --test test_crash_injection_workload -- --nocapture
      - name: Long soak
        env:
          SKIP_GPU_TESTS: "1"
          RUST_LOG: "error"
          BSDB_SOAK_SECONDS: "1800"
        run: cargo test --test soak -- --ignored --nocapture 2>&1 | tee soak.log
      - name: Multi-writer soak
        env:
          SKIP_GPU_TESTS: "1"
          RUST_LOG: "error"
          BSDB_SOAK_SECONDS: "1800"
        run: cargo test --test test_multi_writer_concurrency multi_writer_soak -- --ignored --nocapture 2>&1 | tee multi_writer.log
      - name: Write soak report
        if: always()
        run: |
          {
            echo "# Pre-release soak report"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Soak duration | 1800s |"
            echo "| Result | ${{ job.status }} |"
            echo
            echo "## Soak stats"
            echo
            echo '```'
            grep -h '\[soak-stats\]' soak.log multi_writer.log || echo "(no stats emitted)"
            echo '```'
          } > soak-report.md
          cat soak-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: soak-report.md

  release:
    name: Final Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, macos, sdist, soak-gate]
    environment: release_pypi
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
            # The search gateway ships in lockstep with the engine: bump its
            # PyPI distribution version and keep its core dependency pin in step.
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' contrib/benostreamdb-search/pyproject.toml
            perl -i -pe 's/^(benostreamdb = \{ version = )\"[^\"]*\"/${1}\"$ENV{CARGO_VERSION}\"/' contrib/benostreamdb-search/Cargo.toml
            
            # The flight server ships in lockstep with the engine.
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' server/flight_sql/pyproject.toml
            perl -i -pe 's/^(benostreamdb = \{ version = )\"[^\"]*\"/${1}\"$ENV{CARGO_VERSION}\"/' server/flight_sql/Cargo.toml
            
            # The MCP server ships in lockstep with the engine.
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' contrib/benostreamdb-mcp/pyproject.toml
            perl -i -pe 's/^(benostreamdb = \{ version = )\"[^\"]*\"/${1}\"$ENV{CARGO_VERSION}\"/' contrib/benostreamdb-mcp/Cargo.toml
          fi
      - name: Publish to crates.io
        run: |
          # 1. Publish standalone accelerator crate first
          echo "Publishing benostream-gpu-ann to crates.io..."
          if ! cargo publish -p benostream-gpu-ann --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2> ann_err.log; then
            cat ann_err.log
            if grep -qi "already exists on crates.io" ann_err.log; then
              echo "benostream-gpu-ann already exists on crates.io, continuing."
            else
              echo "Warning: benostream-gpu-ann publish returned an error:"
            fi
          fi

          # Brief pause for crates.io index update
          sleep 10

          # 2. Publish main database crate
          echo "Publishing benostreamdb to crates.io..."
          if ! cargo publish -p benostreamdb --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2> publish_err.log; then
            cat publish_err.log
            if grep -qi "already exists on crates.io" publish_err.log; then
              echo "Version already exists on crates.io, safely continuing."
            else
              echo "Error: Cargo publish failed for an unexpected reason."
              exit 1
            fi
          fi

          # 3. Publish the search gateway crate (depends on core).
          sleep 10
          echo "Publishing benostreamdb-search to crates.io..."
          if ! cargo publish -p benostreamdb-search --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2> search_err.log; then
            cat search_err.log
            if grep -qi "already exists on crates.io" search_err.log; then
              echo "benostreamdb-search already exists on crates.io, safely continuing."
            else
              echo "Error: Cargo publish failed for benostreamdb-search."
              exit 1
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Repair Wheels (Remove Trailing Data for PyPI)
        run: |
          for f in dist/*.whl; do
            echo "Repairing $f"
            zip -q -F "$f" --out "${f}.fixed" || continue
            mv "${f}.fixed" "$f"
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
      # The dbt adapter ships as its own PyPI distribution (`dbt-benostreamdb`),
      # released alongside the core. Its version follows the dbt convention
      # (`<dbt-core-major>.<minor>.<patch>`, e.g. 1.8.0) and is maintained
      # independently in dbt-benostreamdb/dbt/adapters/benostreamdb/__version__.py
      # — it is NOT derived from the engine tag.
      - name: Build dbt adapter (sdist + wheel)
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dbt-benostreamdb/dist dbt-benostreamdb
      - name: Publish dbt adapter to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dbt-benostreamdb/dist
          skip-existing: true
          verbose: true
      # The search gateway is a native Rust crate that also ships as its own
      # PyPI distribution (`benostreamdb-search`). The wheel bundles the same
      # `bsdb-search` binary via maturin (`bindings = "bin"`), released at the
      # engine version alongside the core.
      - name: Build search gateway (maturin wheel)
        run: |
          python -m pip install --upgrade maturin
          maturin build --release --manifest-path contrib/benostreamdb-search/Cargo.toml --out contrib/benostreamdb-search/dist
      - name: Publish search gateway to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: contrib/benostreamdb-search/dist
          skip-existing: true
          verbose: true
      - name: Build flight server (maturin wheel)
        run: |
          maturin build --release --manifest-path server/flight_sql/Cargo.toml --out server/flight_sql/dist
      - name: Publish flight server to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: server/flight_sql/dist
          skip-existing: true
          verbose: true
      - name: Build MCP server (maturin wheel)
        run: |
          maturin build --release --manifest-path contrib/benostreamdb-mcp/Cargo.toml --out contrib/benostreamdb-mcp/dist
      - name: Publish MCP server to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: contrib/benostreamdb-mcp/dist
          skip-existing: true
          verbose: true
      - name: Setup Java 17 (for Spark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Save Java 17 Home
        run: echo "JAVA_17_HOME=$JAVA_HOME" >> $GITHUB_ENV
      - name: Setup Java 23 (for Trino)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Save Java 23 Home
        run: echo "JAVA_TRINO_HOME=$JAVA_HOME" >> $GITHUB_ENV
      - name: Build Java Connectors (Spark, Trino)
        run: |
          chmod +x ./build-connectors.sh
          ./build-connectors.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            dbt-benostreamdb/dist/*
            contrib/benostreamdb-search/dist/*
            contrib/benostreamdb-mcp/dist/*
            server/flight_sql/dist/*
            connector-artifacts/*
          generate_release_notes: true
