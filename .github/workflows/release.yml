name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Limit parallel compilation/linking jobs to avoid running out of memory/disk space on the runner
  CARGO_BUILD_JOBS: 2
  # Reduce disk usage by disabling incremental compilation and heavy debug info
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Opt into Node.js 24 for actions to avoid deprecation warnings (required by June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: [ci]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.10"] # ABI3 Universal Wheels
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-${{ matrix.target }}-${{ matrix.python-version }}"
          cache-targets: false
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "12.1.0"
          method: "network"
          # We only need compilation, not the full driver
          sub-packages: '["nvcc", "cudart-dev"]'
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features "python" --zig
          sccache: "false"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  macos:
    needs: [ci]
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.10"] # ABI3 Universal Wheels
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-${{ matrix.target }}-${{ matrix.python-version }}"
          cache-targets: false
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features "python"
          sccache: "false"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  sdist:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
          fi
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Final Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, macos, sdist]
    environment: release_pypi
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Update version from tag
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            export VERSION=${GITHUB_REF#refs/tags/v}
            export CARGO_VERSION=$(echo $VERSION | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)([a-zA-Z])/\1-\2/')
            echo "Bumping versions to $VERSION (Cargo: $CARGO_VERSION)"
            # Only replace the FIRST occurrence in each file
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{CARGO_VERSION}\"/ and $done = 1' Cargo.toml
            perl -i -pe '$done or s/^version = \".*\"/version = \"$ENV{VERSION}\"/ and $done = 1' pyproject.toml
          fi
      - name: Publish to crates.io
        run: |
          if ! cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2> publish_err.log; then
            cat publish_err.log
            if grep -qi "already exists on crates.io" publish_err.log; then
              echo "Version already exists on crates.io, safely continuing."
              exit 0
            else
              echo "Error: Cargo publish failed for an unexpected reason."
              exit 1
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Repair Wheels (Remove Trailing Data for PyPI)
        run: |
          for f in dist/*.whl; do
            echo "Repairing $f"
            zip -q -F "$f" --out "${f}.fixed" || continue
            mv "${f}.fixed" "$f"
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
