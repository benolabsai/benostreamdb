name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: every job below pins `ubuntu-24.04` instead of `ubuntu-latest`. The
  # `ubuntu-latest` label began migrating to Ubuntu 26.04 on 2026-10-19, and the
  # NVIDIA CUDA apt repo for 26.04 only publishes `cuda-13-3` / `cuda-13-4`
  # (mirrored at ubuntu2404), so `Jimver/cuda-toolkit` fails with
  # "E: Unable to locate package cuda-13-0". Pinning also keeps the toolchain,
  # libpython and Vulkan packages reproducible across runner-image rollouts.
  # Revisit when the CUDA packages we need are published for 26.04.
  # Limit parallel compilation/linking jobs to avoid running out of memory/disk space on the runner
  CARGO_BUILD_JOBS: 2
  # Reduce disk usage by disabling incremental compilation and heavy debug info
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Opt into Node.js 24 for actions to avoid deprecation warnings (required by June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  #########################
  # Lint and format checks
  #########################
  lint:
    name: Rust Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Check documentation links
        run: python3 scripts/check_docs_links.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          # Install the components declared in rust-toolchain.toml up front so
          # that a later `cargo`/`cargo metadata` (e.g. inside maturin) does not
          # trigger rustup's lazy component install, which races the runner's
          # preinstalled cargo-fmt and fails with "detected conflict".
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets

      # `#![deny(warnings)]` includes rustdoc's lints, but nothing in CI built the
      # docs, so an intra-doc link to a private item only surfaced in the Pages
      # workflow (and failed it after the change had already landed). Building the
      # docs here makes the lint part of the normal gate.
      - name: Build API docs
        run: cargo doc --no-deps --features java

      - name: Run Cargo Check
        run: cargo check --all-targets

      # Binary targets are not linted reliably by clippy (it re-lints the
      # same-package lib), but they must at least *build*: this is what catches
      # things like a bin declaring a global allocator that conflicts with the
      # library's.
      - name: Check binary targets
        run: |
          cargo check --bins

  #########################
  # Version single-source
  #########################
  version-check:
    name: Version single-source check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The ONE authored version is Cargo.toml [workspace.package].version. Every
      # connector pyproject inherits it (dynamic = ["version"]). The two places
      # Cargo cannot inherit — the inter-crate dependency pins and the dbt
      # engine pin — are asserted here so they can never silently drift.
      - name: Derived version copies must match the workspace version
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          v = re.search(r'(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"',
                        (root / "Cargo.toml").read_text()).group(1)
          print("workspace version:", v)
          errs = []
          for p in ["pyproject.toml", "contrib/benostreamdb-search/pyproject.toml",
                    "server/flight_sql/pyproject.toml", "contrib/benostreamdb-mcp/pyproject.toml"]:
              if 'dynamic = ["version"]' not in (root / p).read_text():
                  errs.append(p + ': [project] must use dynamic = ["version"]')
          for p in ["contrib/benostreamdb-search/Cargo.toml", "server/flight_sql/Cargo.toml"]:
              m = re.search(r'benostreamdb = \{ version = "([^"]+)"', (root / p).read_text())
              if not m or m.group(1) != v:
                  errs.append(p + ": benostreamdb dep pin is not " + v)
          m = re.search(r'benostreamdb>=([^",\s]+)', (root / "dbt-benostreamdb/pyproject.toml").read_text())
          if not m or m.group(1) != v:
              errs.append("dbt-benostreamdb/pyproject.toml: benostreamdb>= floor is not " + v)
          # Every tool that walks the tree parses these files itself: pytest for
          # rootdir discovery, maturin for the build backend, pip for resolution.
          # A stray byte on line 1 therefore fails somewhere far from the edit, so
          # validate the manifests directly while the signal is still local.
          import tomllib
          for p in ["pyproject.toml", "dbt-benostreamdb/pyproject.toml",
                    "contrib/benostreamdb-search/pyproject.toml",
                    "server/flight_sql/pyproject.toml",
                    "contrib/benostreamdb-mcp/pyproject.toml"]:
              try:
                  tomllib.loads((root / p).read_text())
              except Exception as e:
                  errs.append(p + ": not valid TOML: " + str(e))
          if errs:
              print("\n".join("  - " + e for e in errs))
              sys.exit(1)
          print("all derived version copies match")
          print("all connector manifests parse as TOML")
          PY

  #########################
  # Rust unit/integration tests
  #########################
  test:
    name: Rust Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.2"
          method: "network"

      - name: Prep CUDA Stubs
        run: |
          sudo ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
          echo "/usr/local/cuda/lib64/stubs" | sudo tee /etc/ld.so.conf.d/cuda-stubs.conf
          sudo ldconfig

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Run Cargo Tests (CPU only)
        env:
          SKIP_GPU_TESTS: "1"
          RUST_LOG: "error"
          LD_LIBRARY_PATH: /usr/local/cuda/lib64/stubs:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --lib --tests

      - name: Run Cargo Tests (with python feature)
        timeout-minutes: 20
        env:
          SKIP_GPU_TESTS: "1"
          RUST_LOG: "error"
          LD_LIBRARY_PATH: /usr/local/cuda/lib64/stubs:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --features python --lib --tests -- --skip gpu_execution --nocapture

  #########################
  # macOS / Metal correctness
  #########################
  # GitHub's macos-15 runners are Apple Silicon, so the native Metal backend is
  # testable for free. The cross-backend harness uses CPU as the gold source and
  # validates whatever backend is present (here: Metal).
  metal:
    name: Metal Correctness (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Cross-backend correctness harness (CPU gold vs Metal)
        run: cargo test --lib cross_backend -- --nocapture

  #########################
  # Python tests
  #########################
  # The suite outgrew a single 20-minute job: the Rust build, the Vulkan install
  # and the wheel build were all charged to the same budget as the tests, so the
  # tests themselves had only a few minutes of it. Build the wheel once here,
  # then fan the tests out into independent shards that run in parallel, each
  # with its own timeout and no per-job build cost.
  python-wheel:
    name: Python Wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Vulkan
        # The wheel build links against Vulkan. A runner DNS blip while fetching
        # `libvulkan-dev` failed this job with "Temporary failure resolving
        # 'azure.archive.ubuntu.com'", so retry instead of letting infrastructure
        # flakiness look like a test failure.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libvulkan1 libvulkan-dev && exit 0
            echo "apt attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build wheel
        run: |
          pip install maturin
          maturin build --features python

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: target/wheels/benostreamdb-*.whl
          if-no-files-found: error
          overwrite: true

  # Test shards. Directory-based on purpose: the suite has no pytest markers, so
  # a marker split would mean annotating ~100 files and keeping those annotations
  # honest. The directories already separate the binding surface (`tests/python`)
  # from the full-engine suites (`tests/integration`), the top-level tests, and
  # the heavy stress set.
  #
  # The `catalog` shard targets one file instead of a directory: those tests start
  # real servers (Unity Catalog, Polaris, Nessie, Hive Metastore, PostgreSQL) and
  # the AWS Emulator, so their runtime is dominated by image pulls and must not
  # eat the unit shard's budget.
  pytest:
    name: Python Tests (${{ matrix.shard }})
    needs: [python-wheel]
    runs-on: ubuntu-24.04
    # Ceiling for setup steps; the pytest step itself keeps the per-shard budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            target: tests/python
            # `test_prefilter` is a manual probe rather than a bounded test; the
            # old single job excluded it and that exclusion is preserved.
            # The real-server suite has its own shard, so it is skipped here.
            extra: >-
              --ignore=tests/python/test_prefilter.py
              --ignore=tests/python/test_catalog_real_services.py
          - shard: catalog
            target: tests/python/test_catalog_real_services.py
            extra: ""
            # Container pulls dominate; each test skips when Docker is absent.
            timeout: 40
          - shard: integration
            target: tests/integration
            extra: ""
          - shard: root
            # `tests/` minus every subdirectory == the top-level `tests/*.py`
            # files that the old job collected alongside everything else.
            target: tests/
            extra: >-
              --ignore=tests/python --ignore=tests/integration
              --ignore=tests/stress --ignore=tests/performance
              --ignore=tests/benchmarks
          - shard: stress
            target: tests/stress
            extra: ""
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: python-wheel
          path: dist

      - name: Install wheel and test dependencies
        run: pip install "$(ls dist/benostreamdb-*.whl)[dev]"

      - name: Warm the AWS Emulator cache
        if: matrix.shard == 'catalog'
        uses: actions/cache@v4
        with:
          # Reused across runs so the 176 MB AWS Emulator package is unpacked once.
          path: ${{ runner.temp }}/aws-emulator-cache
          key: aws-emulator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/python/test_catalog_real_services.py') }}

      - name: Pre-pull catalog container images
        if: matrix.shard == 'catalog'
        # A registry hiccup should not fail the shard: the tests pull on demand.
        continue-on-error: true
        run: |
          for image in \
            unitycatalog/unitycatalog:latest \
            apache/polaris:latest \
            ghcr.io/projectnessie/nessie:0.105.5 \
            apache/hive:4.0.0 \
            postgres:17; do
            docker pull "$image" &
          done
          wait

      - name: Run pytest (${{ matrix.shard }})
        timeout-minutes: ${{ matrix.timeout || 20 }}
        env:
          BSDB_AWS_EMULATOR_CACHE: ${{ runner.temp }}/aws-emulator-cache
        run: pytest -v ${{ matrix.target }} ${{ matrix.extra }}

  # Stable aggregate check. Branch protection and the release workflow gate on
  # the job name "Python Tests"; keeping one aggregator with that exact name means
  # the sharded matrix can change without the required check disappearing.
  python-tests:
    name: Python Tests
    needs: [pytest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every shard passed
        if: needs.pytest.result != 'success'
        run: |
          echo "One or more Python test shards did not pass: ${{ needs.pytest.result }}"
          exit 1
      - name: All shards passed
        if: needs.pytest.result == 'success'
        run: echo "All Python test shards passed."

  #########################
  # Dependency security audit
  #########################
  audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny check

  #########################
  # No-panic ratchet for production code paths
  #########################
  # Fails if `unwrap()`/`expect()`/`panic!` sites in production (non-test) code
  # grow relative to scripts/no_panic_baseline.txt. See NO_PANIC_POLICY.md.
  no-panic:
    name: No-Panic Ratchet
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Run no-panic ratchet + hard gate
        run: bash scripts/no_panic_check.sh

  #########################
  # Ecosystem Integrations (Flight, dbt, Spark, Trino)
  #########################
  ecosystem:
    name: Ecosystem Integrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ecosystem Dependencies
        run: |
          # Install everything together so pip can resolve version constraints
          pip install pytest pyspark trino dbt-core adbc-driver-flightsql pyarrow -e . -e dbt-benostreamdb/

      - name: Build Flight SQL server
        run: cargo build -p benostreamdb-flight

      - name: Start Flight SQL server
        run: |
          mkdir -p /tmp/bsdb-warehouse
          BSDB_WAREHOUSE=/tmp/bsdb-warehouse ./target/debug/benostreamdb-flight &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/50051) 2>/dev/null; then exec 3>&-; break; fi
            sleep 1
          done

      - name: Run Arrow Flight SQL Client Tests
        run: pytest -v server/flight_sql/tests/test_flight_client.py

      - name: Run dbt Graph Macros Tests
        run: pytest -v tests/python/test_dbt_graph_macros.py

      - name: Run Spark & Trino Cross-Engine Tests
        # We run these explicitly, ensuring any skipped markers are overriden or handled
        run: pytest -v tests/test_cross_engine_compat.py

  #########################
  # Language connectors (Spark and Trino)
  #
  # The `ecosystem` job above only exercises the Python cross-engine helpers; it
  # never builds a JVM connector. This job builds the shared native library with
  # the `java` feature (the JNI exports are feature-gated, so a plain
  # `cargo build` produces a library with zero JNI symbols) and runs each
  # connector's own suite.
  #
  # Two things drive the matrix:
  #   * Trino publishes no LTS and no SPI compatibility, so each supported band
  #     is compiled and fully tested against its own SPI. See
  #     docs/integrations/TRINO_VERSION_BANDS.md.
  #   * Trino 482+ compiles to release 23, while Spark compiles to release 17,
  #     so the toolchains differ per connector.
  #########################
  connectors:
    name: ${{ matrix.connector }} — ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - connector: trino
            label: "482 (band d)"
            java: "25"
            mvn-args: "-Dtrino.version=482 -Dtrino.band=d"
          - connector: trino
            label: "484 (band e)"
            java: "25"
            mvn-args: "-Dtrino.version=484 -Dtrino.band=e"
          - connector: spark
            label: "4.0"
            java: "21"
            mvn-args: ""
          - connector: spark
            label: "3.5"
            # Spark 3.5 is supported/tested on Java 17. On Java 21 the Arrow 12
            # build it ships fails in `MemoryUtil` with "sun.misc.Unsafe or
            # java.nio.DirectByteBuffer.<init>(long, int) not available", which
            # surfaces as a task failure during INSERT. 4.0 runs on 21.
            java: "17"
            mvn-args: "-P spark-3.5"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v2"

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Without this every connector run re-resolved the whole Maven graph from
      # Central on a cold `~/.m2`, which is slow and maximally exposed to a
      # repository hiccup. The Trino bands share the key because they differ only
      # in the `trino.version` property, not in the dependency set.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ matrix.connector }}-${{ hashFiles('trino-benostreamdb/pom.xml', 'spark-benostreamdb/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-${{ matrix.connector }}-

      - name: Build native library with JNI exports
        # `--features java` is required: without it src/core/ffi.rs is not
        # compiled and the bridge fails at the first native call.
        run: cargo build --features java

      # The restored `~/.m2` can hold Trino coordinates recorded against a
      # repository that no longer exists in the build ("cached from a remote
      # repository ID that is unavailable"). Trino's `check-spi-dependencies`
      # then cannot tell SPI-provided artifacts (airlift slice, opentelemetry)
      # from plugin dependencies and fails the build. Purging the Trino/Airlift/
      # OTel coordinates forces a clean metadata re-resolution (~20 s) instead of
      # trusting a poisoned cache.
      - name: Purge stale Trino metadata from the Maven cache
        if: matrix.connector == 'trino'
        run: |
          rm -rf ~/.m2/repository/io/trino ~/.m2/repository/io/airlift ~/.m2/repository/io/opentelemetry

      - name: Run Trino connector tests
        if: matrix.connector == 'trino'
        working-directory: trino-benostreamdb
        shell: bash
        run: |
          # Maven Central periodically answers a metadata request with a 5xx, which
          # Maven reports as "Could not find artifact ... in central". That is what
          # failed the Trino 484 band: `plexus-utils:3.5.1` (a dependency of the
          # `trino-maven-plugin` build extension) and `junit-bom:6.1.3` (the
          # imported BOM) were reported missing while both resolved fine for the
          # 482 band in the same run and both return 200 from Central. The
          # "Unknown packaging: trino-plugin" and missing JUnit versions were
          # downstream of those two failures, not separate problems.
          #
          # Retry only when the log shows a repository failure, so a genuine SPI or
          # test failure still fails fast instead of being retried three times.
          set -o pipefail
          log="${RUNNER_TEMP}/mvn-trino.log"
          for attempt in 1 2 3; do
            if mvn -B \
                 -Dmaven.wagon.http.retryHandler.count=5 \
                 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
                 test ${{ matrix.mvn-args }} 2>&1 | tee "$log"; then
              exit 0
            fi
            if grep -qE "Could not (find|transfer|resolve) artifact|Non-resolvable|Unresolveable build extension" "$log"; then
              echo "::warning::Maven repository resolution failed (attempt ${attempt}); retrying"
              sleep 20
              continue
            fi
            echo "mvn failed for a non-resolution reason; not retrying"
            exit 1
          done
          exit 1

      - name: Run Spark connector tests
        if: matrix.connector == 'spark'
        working-directory: spark-benostreamdb
        shell: bash
        run: |
          # Same repository-flake handling as the Trino step: retry a Central
          # resolution failure, fail fast on a real build or test failure.
          set -o pipefail
          log="${RUNNER_TEMP}/mvn-spark.log"
          for attempt in 1 2 3; do
            if mvn -B \
                 -Dmaven.wagon.http.retryHandler.count=5 \
                 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
                 clean test ${{ matrix.mvn-args }} 2>&1 | tee "$log"; then
              exit 0
            fi
            if grep -qE "Could not (find|transfer|resolve) artifact|Non-resolvable|Unresolveable build extension" "$log"; then
              echo "::warning::Maven repository resolution failed (attempt ${attempt}); retrying"
              sleep 20
              continue
            fi
            echo "mvn failed for a non-resolution reason; not retrying"
            exit 1
          done
          exit 1

  #########################
  # Cross-engine Iceberg conformance — the upstream `apache/iceberg-rust` reader
  # opens tables written by the engine and asserts the row set. The oracle is a
  # separate workspace (its own Cargo.lock) and links no BenoStreamDB code, so it
  # catches metadata bugs our own reader cannot see. It has already caught three:
  # numeric manifest `content` metadata, missing V3 snapshot row ranges, and
  # relative deletion-vector `referenced_data_file` paths.
  #########################
  iceberg-oracle:
    name: Iceberg V3 Oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache: this job builds a different dependency graph
          # (`iceberg` 0.11 pins arrow-* 58) than the engine jobs.
          workspaces: ". -> target\ntests/iceberg_rust_oracle -> tests/iceberg_rust_oracle/target"
      - name: Generate V2/V3 fixtures with the engine
        run: |
          BSDB_FIXTURE_DIR="$RUNNER_TEMP/bsdb_oracle_fixture" \
            cargo test --test oracle_fixture -- --ignored --nocapture
      - name: Verify with apache/iceberg-rust (V2)
        run: |
          BSDB_ORACLE_URI="file://$RUNNER_TEMP/bsdb_oracle_fixture/v2" \
          BSDB_ORACLE_SUITE=v2 \
          BSDB_ORACLE_EXPECT_IDS=1,2 \
            cargo test --manifest-path tests/iceberg_rust_oracle/Cargo.toml -- --nocapture
      - name: Verify with apache/iceberg-rust (V3)
        run: |
          BSDB_ORACLE_URI="file://$RUNNER_TEMP/bsdb_oracle_fixture/v3" \
          BSDB_ORACLE_SUITE=v3 \
          BSDB_ORACLE_EXPECT_IDS=1,2 \
            cargo test --manifest-path tests/iceberg_rust_oracle/Cargo.toml -- --nocapture

  #########################
  # Workflow lint — validate .github/workflows on every change so release- and
  # tag-only jobs (which are otherwise exercised only at release time) are at
  # least statically checked on every PR.
  #########################
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Validate workflow structure/expressions only. shellcheck integration
          # is disabled: several pre-existing `run:` blocks trip SC2086/SC2155
          # style warnings that would otherwise fail this gate.
          ./actionlint -color -shellcheck=
