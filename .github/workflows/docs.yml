name: Documentation Site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "python/**"
      - "docs/**"
      - "contrib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rust-docs

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Rust API Documentation
        run: cargo doc --no-deps --features python,wgpu,java

      - name: Build Python Extension (for autodoc)
        run: |
          # Use maturin to build and pip install the package so autodoc can find it
          pip install maturin
          maturin build --release || maturin build --release --compatibility manylinux2014
          pip install target/wheels/*.whl

      - name: Prepare Sphinx Guides
        run: |
          mkdir -p docs/source/guides docs/source/integrations docs/source/tutorials
          for f in docs/*.md; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .md | tr '[:upper:]' '[:lower:]')"
            [ "$name" = "index" ] && continue
            ln -sf "../../$(basename "$f")" "docs/source/guides/$name.md"
          done
          for f in docs/integrations/*.md; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .md | tr '[:upper:]' '[:lower:]')"
            [ "$name" = "readme" ] && continue
            ln -sf "../../integrations/$(basename "$f")" "docs/source/integrations/$name.md"
          done
          for f in docs/tutorials/*.md; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .md | tr '[:upper:]' '[:lower:]')"
            ln -sf "../../tutorials/$(basename "$f")" "docs/source/tutorials/$name.md"
          done
          ln -sf "../../architecture/ADR_001_TIGHTENED_INDEX_OVERLAY_CONTRACT.md" "docs/source/guides/adr_001.md"
          ln -sf "../../PRODUCTION_READINESS_ASSESSMENT.md" "docs/source/guides/production_readiness.md"

      - name: Build Sphinx Documentation
        run: |
          sphinx-build -b html docs/source docs/build/html

      - name: Merge Rustdoc into Sphinx Build
        run: |
          mkdir -p docs/build/html/rust
          cp -r target/doc/* docs/build/html/rust/

      - name: Add CNAME and .nojekyll
        run: |
          echo "www.benostreamdb.org" > docs/build/html/CNAME
          touch docs/build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
