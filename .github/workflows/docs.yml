name: Documentation Site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "python/**"
      - "docs/**"
      - "contrib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rust-docs, rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Rust API Documentation
        run: cargo doc --no-deps --features python,wgpu,java

      - name: Build Python Extension (for autodoc)
        run: |
          # Use maturin to build and pip install the package so autodoc can find it
          pip install maturin
          maturin build --release || maturin build --release --compatibility manylinux2014
          pip install target/wheels/*.whl

      - name: Check documentation links
        run: python3 scripts/check_docs_links.py

      - name: Prepare Sphinx Guides
        run: ./scripts/prepare_docs.sh

      - name: Build Sphinx Documentation
        run: |
          sphinx-build -b html docs/source docs/build/html

      - name: Merge Rustdoc into Sphinx Build
        run: |
          mkdir -p docs/build/html/rust
          cp -r target/doc/* docs/build/html/rust/

      - name: Inject canonical URLs
        run: python3 scripts/inject_canonical.py docs/build/html

      - name: Add CNAME and .nojekyll
        run: |
          echo "www.benostreamdb.org" > docs/build/html/CNAME
          touch docs/build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
