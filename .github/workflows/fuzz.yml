name: Fuzz

# Coverage-guided fuzzing of the untrusted-input parsers. A useful run needs
# minutes of wall time and a nightly toolchain (libFuzzer requires `-Z` flags
# that do not exist on stable — see the RUSTUP_TOOLCHAIN env below).
#
# Scheduled weekly (plus manual dispatch), like the Renovate workflow. Fuzzing
# is expensive — five matrix jobs of several minutes each — so it does NOT run
# on every push; an unfiltered `on: push` previously fired it on every branch
# and tag push for no signal.
on:
  schedule:
    # Run weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-22.04
    env:
      # rust-toolchain.toml pins `stable`, which takes precedence over the
      # installed default toolchain. cargo-fuzz builds with libFuzzer -Z flags,
      # so force nightly for every step in this job.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_dense
          - parse_sparse
          - parse_binary
          - sql_rewriters
          - qdrant_request_body
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fuzz-${{ matrix.target }}"
          workspaces: "fuzz -> target"

      - name: Run ${{ matrix.target }} (5 minute budget)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096
        working-directory: fuzz

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
