version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: bench_opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  bsdb-search:
    image: ubuntu:26.04
    container_name: bench_bsdb-search
    command: /app/bsdb-search
    volumes:
      - ./target/release/bsdb-search:/app/bsdb-search:ro
      - ./hsdbg_bench_data:/tmp/hsdbg_bench
    environment:
      - BENOSEARCH_BIND=0.0.0.0
      - BENOSEARCH_PORT=19299
      - BENOSEARCH_STORAGE_URI=file:///tmp/hsdbg_bench
      - BENOSTREAM_BLOCK_CACHE_GB=1
      - BENOSTREAM_CACHE_GB=1
      - RUST_LOG=info
      - RAYON_NUM_THREADS=4
    ports:
      - "19299:19299"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
