# cargo-deny configuration for BenoStreamDB
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true
exclude-dev = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Notify about yanked crates in Cargo.lock
yanked = "warn"
unmaintained = "none"

# Ignore specific advisories that have been reviewed and deemed low-risk in
# transitive dependencies. The full tracking plan (owner, chain, reachability,
# migration path, review date) lives in `docs/DEPENDENCY_RISK.md`.
ignore = [
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2024-0437",
    "RUSTSEC-2026-0177",
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0190",
    # rustls 0.21.12 is EOL and reachable only through the AWS SDK's legacy
    # `hyper-rustls 0.24` client (aws-smithy-http-client). Both advisories are
    # non-exploitable in our configuration: we do not implement a custom
    # `ClientSessionStore` (2026-0346), and we do not enable ECH (2026-0347/0348)
    # or rely on resumption-based key-share prediction (2026-0349). Our own TLS
    # paths (reqwest/object_store/metrics) use rustls 0.23.46, where these are
    # fixed. Tracked in docs/DEPENDENCY_RISK.md; drop when the AWS SDK moves off
    # rustls 0.21.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    # RUSTSEC-2026-0382 (distrusted emSign intermediates). The fixed releases
    # are applied everywhere the resolver allows: rustls-webpki 0.103.16 and
    # webpki-roots 1.0.10. The remaining affected copy is pinned by an upstream
    # parent that cannot move within our dependency graph: webpki-roots 0.26.11
    # only through `sqlx-core 0.8.6` (the fix is 1.0.10+; the 0.26 line has no
    # patched release). Our own TLS paths use the fixed versions.
    # Tracked in docs/DEPENDENCY_RISK.md; drop this ignore when sqlx leaves the
    # affected major line.
    "RUSTSEC-2026-0382",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.9

# Licenses that are automatically approved
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "bzip2-1.0.6",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "Unicode-DFS-2016",
]

# Skim the license text for keywords to approve unclear licenses
[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0xe106d6a3 }]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
